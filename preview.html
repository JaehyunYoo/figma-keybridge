<!doctype html><html><meta charset="utf-8"><title>Keybridge — 데모 미리보기</title><body style="margin:0;background:#f4f4f5;display:flex;align-items:center;flex-direction:column;padding:24px"><p style="font:13px sans-serif;color:#71717a">데모 미리보기 · 샘플 텍스트 2개 사용 · 실제 Figma 파일은 수정하지 않습니다.</p><iframe title="Keybridge plugin preview" src="plugin/ui.html" style="width:min(680px,100%);height:850px;border:0;border-radius:12px;box-shadow:0 12px 40px #18181b0a;border:1px solid #e4e4e7"></iframe><script>
const rows=[{id:'12:34',key:'',name:'Payment action',text:'결제하기',ref:{documentId:'example-document',nodeId:'12:34',page:'Checkout',frame:'Payment'}},{id:'12:35',key:'',name:'Greeting',text:'{name}님, 안녕하세요',ref:{documentId:'example-document',nodeId:'12:35',page:'Checkout',frame:'Payment'}}];
window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='usages')document.querySelector('iframe').contentWindow.postMessage({pluginMessage:{type:'usages',documentId:'example-document',usages:[{key:'common.save',text:'저장',ref:{documentId:'example-document',nodeId:'demo:1',page:'설정',frame:'프로필 편집'}},{key:'common.save',text:'저장',ref:{documentId:'example-document',nodeId:'demo:2',page:'체크아웃',frame:'배송지 편집'}}]}},'*');if(m.type==='scan')document.querySelector('iframe').contentWindow.postMessage({pluginMessage:{type:'rows',rows}},'*');if(m.type==='save'){for(const item of m.rows)Object.assign(rows.find(r=>r.id===item.id),{key:item.key,excluded:item.excluded});document.querySelector('iframe').contentWindow.postMessage({pluginMessage:{type:'rows',rows,saved:true}},'*');}};
</script></body></html>
