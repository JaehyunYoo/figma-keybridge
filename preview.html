<!doctype html><html><meta charset="utf-8"><title>Keybridge — 데모 미리보기</title><body style="margin:0;background:#dfe5e9;display:flex;align-items:center;flex-direction:column;padding:24px"><p style="font:13px sans-serif;color:#344f5d">데모 미리보기 · 샘플 텍스트 2개 사용 · 실제 Figma 파일은 수정하지 않습니다.</p><iframe title="Keybridge plugin preview" src="plugin/ui.html" style="width:680px;height:720px;border:0;border-radius:12px;box-shadow:0 12px 40px #142f3d22"></iframe><script>
const rows=[{id:'12:34',key:'',name:'Payment action',text:'결제하기',ref:{documentId:'example-document',nodeId:'12:34',page:'Checkout',frame:'Payment'}},{id:'12:35',key:'',name:'Greeting',text:'{name}님, 안녕하세요',ref:{documentId:'example-document',nodeId:'12:35',page:'Checkout',frame:'Payment'}}];
window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='scan')document.querySelector('iframe').contentWindow.postMessage({pluginMessage:{type:'rows',rows}},'*');if(m.type==='save'){for(const item of m.rows)rows.find(r=>r.id===item.id).key=item.key;document.querySelector('iframe').contentWindow.postMessage({pluginMessage:{type:'rows',rows}},'*');}};
</script></body></html>
